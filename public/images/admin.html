<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin - Subir Producto</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    input, textarea, select { width: 100%; padding: 8px; margin: 8px 0 16px; border: 1px solid #ddd; border-radius: 6px; }
    button { background: #000; color: #fff; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; width: 100%; }
    #respuesta { margin-top: 20px; padding: 10px; border-radius: 6px; }
    .ok { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h2>Subir Producto</h2>

  <label>Categoría</label>
  <input type="text" id="categoria" placeholder="ej: animados, flores, ropa..." />

  <label>Nombre del producto</label>
  <input type="text" id="nombre" placeholder="ej: Koala azul" />

  <label>Precio</label>
  <input type="number" id="precio" placeholder="ej: 20.50" step="0.01" />

  <label>Descripción</label>
  <textarea id="descripcion" rows="3" placeholder="ej: Color azul, talla M..."></textarea>

  <label>Cantidad</label>
  <input type="number" id="cantidad" placeholder="ej: 5" />

  <label>Imagen</label>
  <input type="file" id="imagen" accept="image/*" />

  <button onclick="subirProducto()">Subir Producto</button>

  <div id="respuesta"></div>

  <script>
    async function subirProducto() {
      const categoria = document.getElementById("categoria").value.trim();
      const nombre = document.getElementById("nombre").value.trim();
      const precio = document.getElementById("precio").value;
      const descripcion = document.getElementById("descripcion").value.trim();
      const cantidad = document.getElementById("cantidad").value;
      const imagen = document.getElementById("imagen").files[0];

      if (!categoria || !imagen) {
        mostrar("Categoría e imagen son obligatorios", false);
        return;
      }

      const formData = new FormData();
      formData.append("imagen", imagen);
      formData.append("nombre", nombre);
      formData.append("precio", precio);
      formData.append("descripcion", descripcion);
      formData.append("cantidad", cantidad);

      try {
        const res = await fetch(`https://api-imagenes-one.vercel.app/subir/${categoria}`, {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        mostrar("✅ " + data.mensaje, true);
      } catch (err) {
        mostrar("❌ Error: " + err.message, false);
      }
    }

    function mostrar(msg, ok) {
      const div = document.getElementById("respuesta");
      div.textContent = msg;
      div.className = ok ? "ok" : "error";
    }
  </script>
</body>
</html>
